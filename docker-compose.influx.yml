services:
  influxdb3:
    image: influxdb:3-core
    user: "0:0"
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=memco-local
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influxdb3-admin-token
    secrets:
      - influxdb3-admin-token
    volumes:
      - type: bind
        source: ./local_influx/data
        target: /var/lib/influxdb3/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

secrets:
  influxdb3-admin-token:
    file: ./local_influx/secrets/influxdb3-admin-token.json
